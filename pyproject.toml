[project]
name = "sphinx-sv-domain"
version = "0.1.0"
description = "A SystemVerilog language domain for the Sphinx documentation tooling."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "RISCY-Lib Contributors" }]
keywords = ["sphinx", "systemverilog", "verilog", "hdl", "documentation", "domain"]
classifiers = [
    "Framework :: Sphinx :: Domain",
    "Framework :: Sphinx :: Extension",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation :: Sphinx",
]
dependencies = [
    "sphinx>=8.0",
    "pyslang>=11,<12",
]

[project.urls]
Homepage = "https://github.com/RISCY-Lib/sphinx-sv-domain"
Repository = "https://github.com/RISCY-Lib/sphinx-sv-domain"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "defusedxml>=0.7",
    "types-docutils>=0.21",
    "tox>=4.25.0",
    "tox-uv>=1.13.1",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_sv_domain"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["sphinx_sv_domain"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# The ``tests/roots`` directory holds mini Sphinx projects (many same-named
# ``conf.py`` modules), not importable package code.
exclude = "^tests/roots/"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# pyslang ships partial stubs that mypy cannot parse (e.g. a ``.pyi`` field
# named ``and``), so skip following imports into it entirely.
module = ["pyslang", "pyslang.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

# ---------------------------------------------------------------------------
# Pytest / Coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --cov=sphinx_sv_domain --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["sphinx_sv_domain"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# Tox (driven by tox-uv) -- CI runs one job per environment (see test.yml).
# ---------------------------------------------------------------------------
[tool.tox]
env_list = [
    "py312",
    "py313",
    "py313-latest",
    "style",
    "typing",
    "docs",
]

[tool.tox.env_run_base]
description = "run the test suite (pytest + coverage) under {env_name}"
runner = "uv-venv-lock-runner"
package = "wheel"
wheel_build_env = ".pkg"
constrain_package_deps = true
use_frozen_constraints = true
dependency_groups = ["dev"]
commands = [[
    "pytest", "-v", "--tb=short", "--basetemp={env_tmp_dir}",
    {replace = "posargs", default = [], extend = true},
]]

[tool.tox.env.style]
description = "run linting and style checks with ruff"
dependency_groups = ["dev"]
skip_install = true
commands = [["ruff", "check"]]

[tool.tox.env.typing]
description = "run the mypy static type checker (strict)"
dependency_groups = ["dev"]
commands = [["mypy"]]

[tool.tox.env.docs]
description = "build the HTML docs with warnings promoted to errors"
dependency_groups = ["docs"]
allowlist_externals = ["rm"]
commands_pre = [["rm", "-rf", "docs/_build"]]
commands = [["sphinx-build", "-E", "-W", "-b", "html", "docs", "docs/_build/html"]]

# Canary env: resolve the newest versions allowed by our dependency ranges
# (sphinx>=8.0, pyslang>=11,<12) instead of the pinned uv.lock, so a breaking
# upstream release surfaces here rather than in a user's install.
[tool.tox.env.py313-latest]
description = "run the test suite against the newest allowed dependency versions (ignores uv.lock)"
runner = "uv-venv-runner"
constrain_package_deps = false
use_frozen_constraints = false

# ---------------------------------------------------------------------------
# Editor-only type checker / formatter (not run in CI; mypy + ruff are the
# authoritative gates -- see [tool.tox]).
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.autopep8]
max-line-length = 100
