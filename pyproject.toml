[project]
name = "sphinx-sv-domain"
version = "0.1.0"
description = "A SystemVerilog language domain for the Sphinx documentation tooling."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "RISCY-Lib Contributors" }]
keywords = ["sphinx", "systemverilog", "verilog", "hdl", "documentation", "domain"]
classifiers = [
    "Framework :: Sphinx :: Domain",
    "Framework :: Sphinx :: Extension",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation :: Sphinx",
]
dependencies = [
    "sphinx>=8.0",
    "pyslang>=11,<12",
]

[project.urls]
Homepage = "https://github.com/RISCY-Lib/sphinx-sv-domain"
Repository = "https://github.com/RISCY-Lib/sphinx-sv-domain"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "defusedxml>=0.7",
    "types-docutils>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_sv_domain"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["sphinx_sv_domain"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# The ``tests/roots`` directory holds mini Sphinx projects (many same-named
# ``conf.py`` modules), not importable package code.
exclude = "^tests/roots/"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# pyslang ships partial stubs that mypy cannot parse (e.g. a ``.pyi`` field
# named ``and``), so skip following imports into it entirely.
module = ["pyslang", "pyslang.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

# ---------------------------------------------------------------------------
# Pytest / Coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --cov=sphinx_sv_domain --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["sphinx_sv_domain"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
